name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  tests-backend:
    name: Tests backend (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, zip, openssl

      - name: Install dependencies
        working-directory: back
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Copy .env file
        working-directory: back
        run: cp .env.test .env
        
      - name: Generate JWT keys
        working-directory: back
        env:
          APP_ENV: test
        run: php bin/console lexik:jwt:generate-keypair -n --env=test

      - name: Create test database schema
        working-directory: back
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test

      - name: Run tests
        working-directory: back
        run: php bin/phpunit

  lint-frontend:
    name: Lint frontend (ESLint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run ESLint
        working-directory: front
        run: npm run lint

  build-docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: [tests-backend, lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build